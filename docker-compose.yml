services:
  db:
    image: postgres:11-alpine
    environment:
      POSTGRES_DB: dinnizer_production
      POSTGRES_USER: dinnizer
      POSTGRES_PASSWORD: dinnizer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinnizer -d dinnizer_production"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dinnizer:dinnizer@db:5432/dinnizer_production
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SECRET_KEY_BASE: local-development-secret-key-base-for-dinnizer
    ports:
      - "13000:3000"

volumes:
  postgres-data:
